    <line x1="126" y1="370" x2="174" y2="370" />
    <line x1="119" y1="435" x2="181" y2="435" />
    <line x1="110" y1="510" x2="190" y2="510" />
    <line x1="97" y1="600" x2="203" y2="600" />
    <line x1="83" y1="695" x2="217" y2="695" />
    <line x1="70" y1="795" x2="230" y2="795" />
