<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <defs>
    <linearGradient id="eiffelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FAFE2" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#9CB5E4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#B4C8EC" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <g transform="translate(30, 10)" stroke="url(#eiffelGrad)" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Spire Tip -->
    <line x1="150" y1="15" x2="150" y2="80" stroke-width="2.5" />
    <circle cx="150" cy="15" r="3.5" fill="#8FAFE2" />
    
    <!-- Top Dome Platform -->
    <path d="M140,80 L160,80 L163,120 L137,120 Z" stroke-width="2" />
    <line x1="134" y1="120" x2="166" y2="120" stroke-width="3" />
    <line x1="140" y1="95" x2="160" y2="95" />

    <!-- Upper Section -->
    <path d="M138,120 L124,310 L176,310 L162,120 Z" stroke-width="2" />
    <!-- X Bracings Upper -->
    <line x1="136" y1="140" x2="164" y2="175" />
    <line x1="164" y1="140" x2="136" y2="175" />
    <line x1="133" y1="190" x2="167" y2="225" />
    <line x1="167" y1="190" x2="133" y2="225" />
    <line x1="129" y1="240" x2="171" y2="275" />
    <line x1="171" y1="240" x2="129" y2="275" />
    <!-- Horizontal Bars Upper -->
    <line x1="136" y1="155" x2="164" y2="155" />
    <line x1="133" y1="205" x2="167" y2="205" />
