    <!-- Double Deck Platform (Middle) -->
    <line x1="118" y1="310" x2="182" y2="310" stroke-width="4" />
    <rect x="122" y="310" width="56" height="16" stroke-width="1.8" fill="rgba(143,175,226,0.1)" />
    <line x1="114" y1="326" x2="186" y2="326" stroke-width="4.5" />

    <!-- Lower Section Pillar Legs -->
    <path d="M120,326 L65,880 M180,326 L235,880" stroke-width="4" />
    <path d="M134,326 L105,880 M166,326 L195,880" stroke-width="2.2" />

    <!-- Main Base Arch -->
    <path d="M98,880 Q150,620 202,880" stroke-width="4.5" fill="rgba(143,175,226,0.05)" />
    <path d="M108,880 Q150,660 192,880" stroke-width="2" />
    <path d="M118,880 Q150,700 182,880" stroke-width="1.5" />

    <!-- X Bracings Lower Section -->
    <line x1="130" y1="350" x2="170" y2="390" />
    <line x1="170" y1="350" x2="130" y2="390" />
    <line x1="123" y1="410" x2="177" y2="460" />
    <line x1="177" y1="410" x2="123" y2="460" />
    <line x1="115" y1="485" x2="185" y2="540" />
    <line x1="185" y1="485" x2="115" y2="540" />
    <line x1="104" y1="570" x2="196" y2="630" />
    <line x1="196" y1="570" x2="104" y2="630" />
    <line x1="90" y1="660" x2="210" y2="730" />
    <line x1="210" y1="660" x2="90" y2="730" />
    <line x1="76" y1="760" x2="224" y2="840" />
    <line x1="224" y1="760" x2="76" y2="840" />

