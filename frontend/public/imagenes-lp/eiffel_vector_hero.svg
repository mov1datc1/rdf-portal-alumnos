<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" preserveAspectRatio="xMidYMax slice" width="100%" height="100%">
  <defs>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70A6FF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- City Skyline Silhouette (Bottom Left & Center) -->
  <path d="M0,650 L0,550 L30,550 L30,520 L50,520 L50,550 L90,550 L90,490 L120,490 L120,550 L160,550 L160,570 L210,570 L210,510 L220,490 L230,510 L250,510 L250,570 L310,570 L310,530 L350,530 L350,570 L400,570 L400,490 L440,490 L440,570 L500,570 L500,520 L540,520 L540,570 L610,570 L610,540 L650,540 L650,570 L720,570 L720,510 L760,510 L760,570 L830,570 L830,540 L870,540 L870,570 L1440,570 L1440,650 Z" fill="url(#skylineGrad)" />

  <!-- Detailed Eiffel Tower Vector (Far Right) -->
  <g transform="translate(1160, 40)" stroke="url(#towerGrad)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Spire tip -->
    <line x1="110" y1="10" x2="110" y2="60" stroke-width="3" stroke="#93C5FD" opacity="0.9" />
    <circle cx="110" cy="10" r="3.5" fill="#93C5FD" />
    
    <!-- Top Platform -->
    <path d="M104,60 L116,60 L118,90 L102,90 Z" stroke-width="2" fill="rgba(147,197,253,0.15)" />
    <line x1="100" y1="90" x2="120" y2="90" stroke-width="3" />

    <!-- Middle Section -->
    <path d="M102,90 L92,230 L128,230 L118,90 Z" stroke-width="2" fill="rgba(147,197,253,0.08)" />
    <line x1="100" y1="110" x2="120" y2="130" />
    <line x1="120" y1="110" x2="100" y2="130" />
    <line x1="98" y1="140" x2="122" y2="160" />
    <line x1="122" y1="140" x2="98" y2="160" />
    <line x1="95" y1="170" x2="125" y2="195" />
    <line x1="125" y1="170" x2="95" y2="195" />
    <line x1="93" y1="200" x2="127" y2="225" />
    <line x1="127" y1="200" x2="93" y2="225" />

    <!-- Middle Double Deck Gallery -->
    <line x1="88" y1="230" x2="132" y2="230" stroke-width="3.5" />
    <rect x="90" y="230" width="40" height="12" fill="rgba(147,197,253,0.2)" stroke-width="1.5" />
    <line x1="84" y1="242" x2="136" y2="242" stroke-width="4" />

    <!-- Base Section Leg Pillars -->
    <path d="M88,242 L55,560 M132,242 L165,560" stroke-width="3.5" />
    <path d="M98,242 L80,560 M122,242 L140,560" stroke-width="2" />

    <!-- Base Arch -->
    <path d="M75,560 Q110,410 145,560" stroke-width="3.5" fill="rgba(147,197,253,0.05)" />
    <path d="M82,560 Q110,435 138,560" stroke-width="1.5" />

    <!-- Base Lattice Cross Bracing -->
    <line x1="95" y1="260" x2="125" y2="285" />
    <line x1="125" y1="260" x2="95" y2="285" />
    <line x1="90" y1="300" x2="130" y2="330" />
    <line x1="130" y1="300" x2="90" y2="330" />
    <line x1="85" y1="350" x2="135" y2="385" />
    <line x1="135" y1="350" x2="85" y2="385" />
    <line x1="80" y1="400" x2="140" y2="440" />
    <line x1="140" y1="400" x2="80" y2="440" />
    <line x1="70" y1="450" x2="150" y2="495" />
    <line x1="150" y1="450" x2="70" y2="495" />
    <line x1="62" y1="500" x2="158" y2="550" />
    <line x1="158" y1="500" x2="62" y2="550" />

    <!-- Horizontal Support Bars -->
    <line x1="91" y1="270" x2="129" y2="270" />
    <line x1="86" y1="315" x2="134" y2="315" />
    <line x1="81" y1="365" x2="139" y2="365" />
    <line x1="74" y1="420" x2="146" y2="420" />
    <line x1="65" y1="475" x2="155" y2="475" />
    <line x1="58" y1="525" x2="162" y2="525" />
  </g>
</svg>